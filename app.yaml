name: schedora
region: nyc
build:
  docker_context: .
  dockerfile: Dockerfile.backend

http:
  route: /
  port: 8080
  cors:
    allow_origins:
      - "*"
    allow_methods:
      - "*"
    allow_headers:
      - "*"

run:
  command: uvicorn server:app --host 0.0.0.0 --port 8000
  monitor_ports: true

env:
  - key: PORT
    value: 8000
